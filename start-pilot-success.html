<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilot Enquiry Sent — Story Engine™</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="img/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Syne:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#0d0c0a; --red:#891a10; --f:'Barlow Condensed',sans-serif; --b:'Syne',sans-serif; }
    body { background: var(--ink); color: #f2ede4; font-family: var(--b); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .mark { font-family: var(--f); font-size: .8rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: rgba(242,237,228,.45); margin-bottom: 3rem; }
    .mark .badge { background: var(--red); color: #f2ede4; padding: .1em .45em .14em; letter-spacing: .12em; }
    h1 { font-family: var(--f); font-size: clamp(2.4rem, 7vw, 5rem); font-weight: 700; text-transform: uppercase; line-height: .98; margin-bottom: 1.6rem; }
    h1 .hi { background: var(--red); font-style: italic; display: inline-block; padding: .04em .14em .08em; }
    p { font-size: .95rem; color: rgba(242,237,228,.5); line-height: 1.75; max-width: 420px; margin-bottom: 2.5rem; }
    a.btn { font-family: var(--f); font-size: .7rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; text-decoration: none; padding: .85rem 2rem; border: 1px solid rgba(242,237,228,.25); color: #f2ede4; transition: background .25s, border-color .25s; }
    a.btn:hover { background: var(--red); border-color: var(--red); }
  </style>
</head>
<body>
  <div class="mark">Story <span class="badge">Engine™</span></div>
  <h1>Your pilot <span class="hi">starts here.</span></h1>
  <p>Thanks — your enquiry has landed. I'll reply within one working day to set up a quick call and find a shoot date.</p>
  <a href="/" class="btn">Back to home</a>
<script data-goatcounter="https://storyengine.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
